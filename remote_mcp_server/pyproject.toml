[project]
name = "simdorei-local-project-mcp"
version = "0.1.0"
description = "Ephemeral ChatGPT-to-local-Codex project MCP gateway"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx2[http2,brotli,zstd]>=2,<3",
    "mcp==1.28.1",
    "pydantic-settings>=2.10,<3",
    "structlog>=25,<26",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
]

[tool.uv]
package = false
