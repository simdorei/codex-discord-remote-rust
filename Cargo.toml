[workspace]
members = [
    "crates/cdr-app-server",
    "crates/cdr-codex-state",
    "crates/cdr-core",
    "crates/cdr-discord",
    "crates/cdr-mcp-server",
    "crates/cdr-pro",
    "crates/cdr-remote-agent",
    "crates/cdr-remote-protocol",
    "crates/cdr-runtime",
    "crates/cdr-store",
    "crates/cdr-windows-native",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "MIT"

[workspace.dependencies]
axum = { version = "=0.8.9", features = ["ws"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
cdr-core = { path = "crates/cdr-core" }
cdr-app-server = { path = "crates/cdr-app-server" }
cdr-remote-protocol = { path = "crates/cdr-remote-protocol" }
hex = "0.4.3"
chrono = { version = "0.4.42", features = ["serde"] }
futures-util = "0.3.34"
regex = "1.12.2"
rmcp = { version = "=3.1.4", features = ["transport-streamable-http-server"] }
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "query", "rustls", "stream"] }
rusqlite = { version = "0.40.0", features = ["backup", "bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
same-file = "1.0.6"
similar = "3.2.0"
thiserror = "2.0.18"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tokio-util = "0.7.19"
twilight-gateway = "=0.17.1"
twilight-http = "=0.17.1"
twilight-model = "=0.17.1"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace.dependencies.tempfile]
version = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
debug = 1
incremental = false

[profile.test]
debug = 1
incremental = false
