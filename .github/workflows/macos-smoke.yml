name: macOS smoke

on:
  push:
  pull_request:

jobs:
  macos-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify pinned Rust workspace
        run: |
          set -euo pipefail
          rustup show active-toolchain
          cargo fmt --all -- --check
          cargo build --workspace --locked
          cargo test --workspace --locked --all-targets -- --test-threads=2
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Verify packaged plugin cachebuster
        if: >-
          github.event_name == 'pull_request' ||
          github.event.before != '0000000000000000000000000000000000000000'
        env:
          PLUGIN_VERSION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./target/debug/cdr-pro-helper verify-cachebuster --repo-root .
      - name: Verify native Pro and installation contracts
        run: |
          set -euo pipefail
          cargo test --locked -p cdr-pro --all-targets -- --test-threads=2
          cargo test --locked -p cdr-runtime --test shell_wrapper_contract --test admin_cli_contract
      - name: Verify token setup dry-runs
        run: |
          set -euo pipefail
          bash -n install.sh setup-discord-bot.sh codex-discord-bot.sh
          bash install.sh --dry-run --skip-build --skip-env-file --skip-codex-plugin
          ./target/debug/cdr-runtime --admin setup-discord --dry-run --repo-root .
          bash setup-discord-bot.sh --dry-run
