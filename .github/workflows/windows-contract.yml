name: Diagnostic Windows fixture initialization

on:
  push:
    branches:
      - diagnostic/windows-fixture-startup-20260921

permissions:
  contents: read

jobs:
  diagnose-fixture-load:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Observe bounded isolated fixture initialization
        shell: pwsh
        run: |
          $temporary = $env:RUNNER_TEMP
          if ([string]::IsNullOrWhiteSpace($temporary) -or
              -not [IO.Path]::IsPathFullyQualified($temporary) -or
              $temporary.Contains("`r") -or $temporary.Contains("`n") -or
              -not [IO.Directory]::Exists($temporary)) {
            throw 'RUNNER_TEMP must be an existing absolute directory'
          }
          ./.review/windows-process/probe-maintenance-load.ps1 -SourceRoot $env:GITHUB_WORKSPACE -TemporaryRoot $temporary
